<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой ИИ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px; background: #1e293b; text-align: center; font-weight: 600; font-size: 16px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.4; font-size: 15px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 4px; }
  .err { background: #7f1d1d; align-self: center; font-size: 13px; }
  footer { display: flex; gap: 8px; padding: 12px; background: #1e293b; }
  #input { flex: 1; padding: 14px; border-radius: 12px; border: none; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
  #send { padding: 14px 20px; border: none; border-radius: 12px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 600; }
  #send:disabled { opacity: .5; }
  .loading { opacity: 0.7; font-style: italic; }
</style>
</head>
<body>
<header>🤖 Мой ИИ</header>
<div id="chat"><div class="msg bot">Привет! Я твой ИИ.</div></div>
<footer>
  <input id="input" placeholder="Сообщение..." autocomplete="off">
  <button id="send">Отпр.</button>
</footer>
<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [{ role: "system", content: "Ты полезный ИИ-помощник." }];

  function addMsg(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, "user");
    history.push({ role: "user", content: text });
    input.value = "";
    send.disabled = true;
    
    const loading = document.createElement("div");
    loading.className = "msg bot loading";
    loading.textContent = "Думает...";
    chat.appendChild(loading);
    chat.scrollTop = chat.scrollHeight;

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await r.json();
      chat.removeChild(loading);
      addMsg(data.choices[0].message.content, "bot");
      history.push({ role: "assistant", content: data.choices[0].message.content });
    } catch (e) {
      chat.removeChild(loading);
      addMsg("Ошибка сети", "err");
    } finally {
      send.disabled = false;
      input.focus();
    }
  }
  send.onclick = ask;
  input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
